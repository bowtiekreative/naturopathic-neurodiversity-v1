document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px;cursor:pointer\" style-hover=\"background:#342468\" style-focus=\"outline:3px solid #947AF5;outline-offset:2px\">View profile and message<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"background:#EFEAF9;border-radius:16px;padding:20px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n          <p style=\"margin:0;color:#342468;max-width:520px\">Not sure who to pick? Send one message and we'll suggest up to three doctors who fit.<\u002Fp>\n          <button sc-camel-on-click=\"{{ goContact }}\" style=\"background:#FFFFFF;color:#342468;border:1px solid #CFC6E6;border-radius:10px;font:inherit;font-weight:700;font-size:16px;padding:10px 18px;cursor:pointer\" style-hover=\"background:#FAF8F4\" style-focus=\"outline:3px solid #947AF5\">Ask for help choosing<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showFormPage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:32px 24px 80px\">\n    <sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ goResults }}\" style=\"background:none;border:0;font:inherit;font-size:16px;color:#685AC8;cursor:pointer;padding:6px 0;margin-bottom:18px;text-decoration:underline\">← Back to results<\u002Fbutton>\n    <\u002Fsc-if>\n    <div style=\"display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start\">\n      <div style=\"flex:3 1 420px;min-width:0\">\n        <sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:center\">\n            <div style=\"width:140px;height:140px;border-radius:20px;flex:none;background:repeating-linear-gradient(45deg,#EFEAF9 0 10px,#F7F4FC 10px 20px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#685AC8\">headshot<\u002Fdiv>\n            <div style=\"flex:1 1 260px;min-width:0\">\n              <h1 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,42px);color:#342468;margin:0;line-height:1.15\">{{ p.name }}, {{ p.cred }}<\u002Fh1>\n              <p style=\"margin:6px 0 0;color:#4A4744;font-size:18px\">{{ p.pron }} · {{ p.clinic }} · {{ p.place }}<\u002Fp>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:12px\">\n                <sc-for list=\"{{ p.badges }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <span style=\"font-size:14px;padding:4px 12px;border-radius:999px;background:{{ b.bg }};color:{{ b.fg }}\">{{ b.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <h2 style=\"font-size:20px;color:#342468;margin:36px 0 8px\">About<\u002Fh2>\n          <p style=\"margin:0;font-size:18px;max-width:640px;text-wrap:pretty\">{{ p.bio }}<\u002Fp>\n          <dl style=\"margin:32px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:#E4DDF0;border:1px solid #E4DDF0;border-radius:16px;overflow:hidden\">\n            <sc-for list=\"{{ p.facts }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div style=\"background:#FFFFFF;padding:18px 20px\">\n                <dt style=\"font-size:14px;font-weight:700;color:#54725A;text-transform:uppercase;letter-spacing:.05em\">{{ f.k }}<\u002Fdt>\n                <dd style=\"margin:4px 0 0;color:#2D2B29\">{{ f.v }}<\u002Fdd>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdl>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n          <h1 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,44px);color:#342468;margin:12px 0 14px;line-height:1.15\">Send us a message<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;max-width:520px;text-wrap:pretty\">Pick a doctor, or choose \"Help me choose\" and our team will suggest up to three who fit what you describe.<\u002Fp>\n          <p style=\"margin:18px 0 0;font-size:18px;max-width:520px;text-wrap:pretty\">Referring a patient? Choose \"A patient I'm referring\" and add your clinic details in the message.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"flex:2 1 340px;min-width:0;background:#FFFFFF;border:1px solid #E4DDF0;border-radius:20px;padding:28px\">\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ onSend }}\" style=\"display:flex;flex-direction:column;gap:18px\">\n            <h2 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:26px;color:#342468;margin:0\">{{ formTitle }}<\u002Fh2>\n            <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n              <label style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:15px;font-weight:700;color:#342468\">Doctor<\u002Fspan>\n                <sc-raw-select value=\"{{ cDoc }}\" sc-camel-on-change=\"{{ onCDoc }}\" style=\"font:inherit;font-size:16px;padding:12px 10px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29\" style-focus=\"outline:3px solid #947AF5\">\n                  <sc-for list=\"{{ docOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:15px;font-weight:700;color:#342468\">Who is this for?<\u002Fspan>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ forChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" aria-pressed=\"{{ c.on }}\" style=\"font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }}\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:15px;font-weight:700;color:#342468\">Your name<\u002Fspan>\n              <input required=\"{{ true }}\" sc-camel-auto-complete=\"name\" style=\"font:inherit;font-size:16px;padding:12px 14px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29;width:100%\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:15px;font-weight:700;color:#342468\">Email<\u002Fspan>\n              <input type=\"email\" required=\"{{ true }}\" sc-camel-auto-complete=\"email\" style=\"font:inherit;font-size:16px;padding:12px 14px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29;width:100%\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:15px;font-weight:700;color:#342468\">Phone <span style=\"font-weight:400;color:#4A4744\">(optional)<\u002Fspan><\u002Fspan>\n              <input type=\"tel\" sc-camel-auto-complete=\"tel\" style=\"font:inherit;font-size:16px;padding:12px 14px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29;width:100%\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\">\n            <\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:15px;font-weight:700;color:#342468\">Best way to reply<\u002Fspan>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ replyChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" aria-pressed=\"{{ c.on }}\" style=\"font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }}\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:15px;font-weight:700;color:#342468\">Message<\u002Fspan>\n              <textarea required=\"{{ true }}\" rows=\"5\" placeholder=\"A few lines about what you're looking for. No need to share records yet.\" style=\"font:inherit;font-size:16px;padding:12px 14px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29;width:100%;resize:vertical\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"submit\" style=\"background:#685AC8;color:#FFFFFF;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:18px;padding:14px 24px;cursor:pointer\" style-hover=\"background:#342468\" style-focus=\"outline:3px solid #947AF5;outline-offset:2px\">Send message<\u002Fbutton>\n            <p style=\"margin:0;font-size:14px;color:#4A4744;text-wrap:pretty\">Your message goes to the clinic by email. No account is created. For a medical emergency, call 911.<\u002Fp>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;padding:12px 0\">\n            <span style=\"width:48px;height:48px;border-radius:50%;background:#AEDE9E;display:flex;align-items:center;justify-content:center;font-size:22px;color:#2D2B29;font-weight:700\">✓<\u002Fspan>\n            <h2 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:28px;color:#342468;margin:0\">Message sent<\u002Fh2>\n            <p style=\"margin:0;font-size:18px;text-wrap:pretty\">{{ sentLine }}<\u002Fp>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:6px\">\n              <button sc-camel-on-click=\"{{ goResults }}\" style=\"background:#685AC8;color:#FFFFFF;border:0;border-radius:10px;font:inherit;font-weight:700;padding:12px 20px;cursor:pointer\" style-hover=\"background:#342468\">Back to doctors<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ sendAnother }}\" style=\"background:#FFFFFF;color:#342468;border:1px solid #CFC6E6;border-radius:10px;font:inherit;font-weight:700;padding:12px 20px;cursor:pointer\" style-hover=\"background:#EFEAF9\">Send another<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background:#342468;color:#FFFFFF;position:relative;overflow:hidden\">\n    <span style=\"position:absolute;right:-120px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:#54725A\"><\u002Fspan>\n    <div style=\"max-width:1200px;margin:0 auto;padding:76px 24px 84px;position:relative\">\n      <p style=\"margin:0 0 16px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#AEDE9E;font-weight:700\">About this directory<\u002Fp>\n      <h1 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(36px,5vw,56px);line-height:1.1;margin:0;max-width:820px;text-wrap:balance\">Finding care shouldn't mean explaining your brain from scratch every time.<\u002Fh1>\n      <p style=\"font-size:20px;max-width:620px;margin:22px 0 0;color:#EDE8FB;text-wrap:pretty\">We list naturopathic doctors across the US and Canada who have real training in neurodevelopmental care, and who treat neurodivergence as a difference to support, not something to fix.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:68px 24px 20px\">\n    <h2 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:32px;color:#342468;margin:0 0 8px\">What \"neurodiversity-affirming\" means here<\u002Fh2>\n    <p style=\"margin:0 0 28px;color:#4A4744;font-size:18px;max-width:640px\">Every doctor listed agrees to these in writing.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n      <div style=\"background:#FFFFFF;border:1px solid #E4DDF0;border-radius:16px;padding:26px\">\n        <span style=\"display:block;width:14px;height:14px;border-radius:50%;background:#947AF5\"><\u002Fspan>\n        <h3 style=\"font-size:20px;color:#342468;margin:14px 0 6px\">Support, not cures<\u002Fh3>\n        <p style=\"margin:0;color:#4A4744;text-wrap:pretty\">Goals are about sleep, digestion, energy, anxiety and comfort. No one here promises to cure autism or ADHD.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #E4DDF0;border-radius:16px;padding:26px\">\n        <span style=\"display:block;width:14px;height:14px;border-radius:50%;background:#947AF5\"><\u002Fspan>\n        <h3 style=\"font-size:20px;color:#342468;margin:14px 0 6px\">You set the pace<\u002Fh3>\n        <p style=\"margin:0;color:#4A4744;text-wrap:pretty\">Sensory needs, stimming, shutdowns and communication preferences are respected in every visit.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #E4DDF0;border-radius:16px;padding:26px\">\n        <span style=\"display:block;width:14px;height:14px;border-radius:50%;background:#947AF5\"><\u002Fspan>\n        <h3 style=\"font-size:20px;color:#342468;margin:14px 0 6px\">Part of your team<\u002Fh3>\n        <p style=\"margin:0;color:#4A4744;text-wrap:pretty\">Doctors work alongside your family doctor, pediatrician, psychiatrist or therapists, and never ask you to stop prescribed care.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:56px 24px 20px;display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start\">\n    <div style=\"flex:1 1 300px;max-width:420px\">\n      <h2 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:32px;color:#342468;margin:0 0 10px\">How we vet every listing<\u002Fh2>\n      <p style=\"margin:0;color:#4A4744;font-size:18px;text-wrap:pretty\">Each application is reviewed by a person, not an algorithm. Listings are rechecked every year.<\u002Fp>\n    <\u002Fdiv>\n    <ol style=\"flex:2 1 420px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:#E4DDF0;border:1px solid #E4DDF0;border-radius:16px;overflow:hidden\">\n      <li style=\"background:#FFFFFF;padding:22px 24px;display:flex;gap:18px\">\n        <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#AEDE9E;color:#2D2B29;font-weight:700;display:flex;align-items:center;justify-content:center\">1<\u002Fspan>\n        <div><p style=\"margin:0;font-weight:700;color:#342468\">License check<\u002Fp><p style=\"margin:2px 0 0;color:#4A4744\">We confirm an active ND or NMD license with the regulator in each state or province where they practice.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"background:#FFFFFF;padding:22px 24px;display:flex;gap:18px\">\n        <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#AEDE9E;color:#2D2B29;font-weight:700;display:flex;align-items:center;justify-content:center\">2<\u002Fspan>\n        <div><p style=\"margin:0;font-weight:700;color:#342468\">Training in neurodevelopmental care<\u002Fp><p style=\"margin:2px 0 0;color:#4A4744\">Doctors show continuing education in areas like ADHD, autism, PDA, sensory processing or learning differences.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li style=\"background:#FFFFFF;padding:22px 24px;display:flex;gap:18px\">\n        <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#AEDE9E;color:#2D2B29;font-weight:700;display:flex;align-items:center;justify-content:center\">3<\u002Fspan>\n        <div><p style=\"margin:0;font-weight:700;color:#342468\">A written commitment<\u002Fp><p style=\"margin:2px 0 0;color:#4A4744\">They sign on to the three principles above. If we hear concerns from patients, we follow up and may remove a listing.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:56px 24px 72px\">\n    <div style=\"background:#EFEAF9;border-radius:20px;padding:36px;display:flex;gap:36px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 300px\">\n        <h2 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:28px;color:#342468;margin:0 0 10px\">What naturopathic care can help with<\u002Fh2>\n        <p style=\"margin:0;color:#2D2B29;text-wrap:pretty\">Day-to-day things that make life harder: sleep, digestion and feeding, energy, anxiety, and sensory comfort. Visits are usually longer than a typical medical appointment, so there's time to talk.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 300px\">\n        <h2 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:28px;color:#342468;margin:0 0 10px\">What it doesn't replace<\u002Fh2>\n        <p style=\"margin:0;color:#2D2B29;text-wrap:pretty\">Diagnosis, prescriptions you already rely on, therapy, or emergency care. Rules on what NDs can do vary by state and province, and each profile lists where a doctor is licensed.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:32px\">\n      <button sc-camel-on-click=\"{{ goResults }}\" style=\"background:#685AC8;color:#FFFFFF;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:18px;padding:14px 26px;cursor:pointer\" style-hover=\"background:#342468\" style-focus=\"outline:3px solid #947AF5;outline-offset:2px\">Find a doctor<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goContact }}\" style=\"background:#FFFFFF;color:#342468;border:1px solid #CFC6E6;border-radius:12px;font:inherit;font-weight:700;font-size:18px;padding:14px 26px;cursor:pointer\" style-hover=\"background:#EFEAF9\" style-focus=\"outline:3px solid #947AF5;outline-offset:2px\">Ask us a question<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:44px 24px 80px;display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start\">\n    <div style=\"flex:2 1 320px;min-width:0\">\n      <p style=\"margin:0 0 12px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#54725A;font-weight:700\">For practitioners<\u002Fp>\n      <h1 style=\"font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,44px);color:#342468;margin:0 0 16px;line-height:1.15\">List your practice<\u002Fh1>\n      <p style=\"margin:0 0 28px;font-size:18px;text-wrap:pretty\">We review every application by hand and reply by email. Families and clinicians contact you directly. There's no portal to manage.<\u002Fp>\n      <h2 style=\"font-size:18px;color:#342468;margin:0 0 12px\">What we check<\u002Fh2>\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px\">\n        <li style=\"display:flex;gap:12px\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#7EA55C;margin-top:7px\"><\u002Fspan>An active ND or NMD license where you practice<\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#7EA55C;margin-top:7px\"><\u002Fspan>Continuing education in neurodevelopmental care<\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#7EA55C;margin-top:7px\"><\u002Fspan>A commitment to work alongside each patient's existing care team<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"flex:3 1 420px;min-width:0;background:#FFFFFF;border:1px solid #E4DDF0;border-radius:20px;padding:30px\">\n      <sc-if value=\"{{ joinNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onJoin }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:15px;font-weight:700;color:#342468\">Full name<\u002Fspan>\n            <input required=\"{{ true }}\" style=\"font:inherit;font-size:16px;padding:12px 14px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29;width:100%\" style-focus=\"outline:3px solid #947AF5;outline-offset:1px\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:15px;font-weight:700;color:#342468\">Credential<\u002Fspan>\n            <sc-raw-select style=\"font:inherit;font-size:16px;padding:12px 10px;border:1px solid #CFC6E6;border-radius:10px;background:#FFFFFF;color:#2D2B29\" style-focus=\"outline:3px solid #947AF5\"><option>ND<\u002Foption><option>NMD<\u002Foption><\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:15px;font-weight:700;color:#342468\">License number<\u002Fspan>\n            <input requ
